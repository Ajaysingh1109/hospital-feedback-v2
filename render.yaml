services:
  # 1. FastAPI Cloud Backend Service
  - type: web
    name: hospital-feedback-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-feedback-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: AUDIO_STORAGE_DIR
        value: /tmp/audio
      - key: AUDIO_RETENTION_POLICY
        value: keep
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MASTER_USERNAME
        value: Apollo@123
      - key: MASTER_PASSWORD
        value: 2321@Apollo
      - key: MASTER_DISPLAY_NAME
        value: "Apollo Master Administrator"

databases:
  # 2. Central Managed PostgreSQL Database
  - name: hospital-feedback-db
    databaseName: hospital_feedback
    user: hospital_user
    plan: free
