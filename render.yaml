services:
  # Unified FastAPI Backend + Compiled React Frontend Docker Service
  - type: web
    name: hospital-feedback-v2
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DATABASE_URL
        sync: false  # Configure external Supabase Session Pooler PostgreSQL URI in Render Dashboard
      - key: CORS_ORIGINS
        value: "*"
      - key: AUDIO_STORAGE_DIR
        value: /tmp/audio  # Transient processing staging only; persistent audio is stored in Supabase Storage
      - key: AUDIO_RETENTION_POLICY
        value: keep
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MASTER_USERNAME
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: MASTER_DISPLAY_NAME
        value: "Hospital Master Administrator"
      - key: FEEDBACK_USER_USERNAME
        sync: false
      - key: FEEDBACK_USER_PASSWORD
        sync: false
      - key: FEEDBACK_USER_DISPLAY_NAME
        value: "Duty Feedback Nurse"
      - key: CRON_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false  # Configure Supabase Project URL in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Configure Supabase Service Role Secret in Render Dashboard
      - key: SUPABASE_STORAGE_BUCKET
        value: hospital-audio-private
